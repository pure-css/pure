name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Auto-caching runs the bundled npm (v11) before it is upgraded
          # below, which fails the devEngines npm >=12 check.
          package-manager-cache: false
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm test
