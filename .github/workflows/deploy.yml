name: Deploy

on:
  push:
    branches: [main]
  # Started by the Dependabot auto-merge workflow, since merges made with
  # GITHUB_TOKEN don't trigger `push` workflows, and by the Publish workflow
  # after a release reaches npm.
  workflow_dispatch:

permissions:
  contents: read

# Deploy one at a time, in order; never cancel a deploy in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Auto-caching runs the bundled npm (v11) before it is upgraded
          # below, which fails the devEngines npm >=12 check.
          package-manager-cache: false
      - run: npm install -g npm@12
      # Builds Pure into build/, which the docs site bundles.
      - run: npm ci
      - name: Build the docs site
        working-directory: site
        run: |
          npm ci
          # Link to the root package.json version once it's on npm, so a
          # release updates the site without bumping site/package.json.
          # Otherwise (a -pre version, or not yet published) keep the pinned
          # version, which is always a published one.
          version=$(node -p "require('../package.json').version")
          if npm view "purecss@$version" version > /dev/null 2>&1; then
            npm install --no-save "purecss@$version"
          else
            echo "::notice::purecss@$version is not on npm; using the pinned version."
          fi
          npm run pure
          npm run build
      - name: Check that every docs page renders
        working-directory: site
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm test
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}
      - name: Release to GitHub Pages
        working-directory: site
        env:
          DEPLOYMENT_BRANCH: main
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_NAME: ${{ secrets.GH_NAME }}
          GIT_USER: ${{ secrets.GH_NAME }}
          USE_SSH: true
        run: |
          git config --global user.name "${GH_NAME}"
          git config --global user.email "${GH_EMAIL}"
          npx docusaurus deploy --skip-build
